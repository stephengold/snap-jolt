---
# GitHub Actions workflow for commits pushed to the snap-jolt repo - "master" branch

name: CI at GitHub
on:
  # trigger this workflow on pushes and also on pull requests
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  Java11-MacOS:
    if: contains(toJson(github.event.commits), '[ci skip] ') == false
    runs-on: macos-26
    timeout-minutes: 9
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 11
      - uses: actions/checkout@v7
      - run: ./gradlew PrintConfig HelloWorld --console=plain

  Java17-MacOS:
    if: contains(toJson(github.event.commits), '[ci skip] ') == false
    runs-on: macOS-26-intel
    timeout-minutes: 9
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17
      - uses: actions/checkout@v7
      - run: ./gradlew PrintConfig HelloWorld --console=plain

  Java21-Windows:
    if: contains(toJson(github.event.commits), '[ci skip] ') == false
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 9
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: actions/checkout@v7
      - run: ./gradlew PrintConfig HelloWorld --console=plain
        shell: bash

  Java25-Linux:
    if: contains(toJson(github.event.commits), '[ci skip] ') == false
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 9
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: 'liberica'
          java-version: '25'
      - uses: actions/checkout@v7
      - run: ./gradlew PrintConfig HelloWorld --console=plain

  Java25-Windows:
    if: contains(toJson(github.event.commits), '[ci skip] ') == false
    runs-on: windows-2025
    timeout-minutes: 9
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'
      - uses: actions/checkout@v7
      - run: ./gradlew PrintConfig HelloWorld --console=plain
        shell: bash

  Java27-Linux:
    if: contains(toJson(github.event.commits), '[ci skip] ') == false
    runs-on: ubuntu-26.04
    timeout-minutes: 9
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: 'liberica'
          java-version: '27'
      - uses: actions/checkout@v7
      - run: ./gradlew PrintConfig HelloWorld --console=plain
